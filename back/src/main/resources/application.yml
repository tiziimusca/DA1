server:
  port: 8080

spring:
  # --- Configuración de la Base de Datos e JPA ---
  datasource:
    url: jdbc:h2:mem:auctiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

  # --- Configuración de Mailtrap (Agrupada dentro de spring) ---
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: ${SMTP_USER:apikey}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          from: ${SMTP_FROM:abast.no.responda@gmail.com}

app:
  jwt:
    auth-token-ttl-minutes: 1440

logging:
  level:
    org.springframework: INFO